<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order – Village Market Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">🌾 Village <span>Market Hub</span></a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="seller.html">Sell with Us</a></li>
          <li><a href="order.html" class="active">Order</a></li>
          <li><a href="delivery.html">Delivery</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section">
    <h2 class="section-title">Customer Order</h2>
    <p class="section-sub">Order fresh products from village sellers</p>

    <div class="form-container">
      <div class="success-msg">Order placed successfully! (Demo only – no data is saved)</div>
      <form id="orderForm">
        <div class="form-group">
          <label for="customerName">Your Name *</label>
          <input type="text" id="customerName" name="customerName" required placeholder="Full name">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="customerPhone">Phone *</label>
            <input type="tel" id="customerPhone" name="customerPhone" required placeholder="10-digit mobile">
          </div>
          <div class="form-group">
            <label for="customerEmail">Email (optional)</label>
            <input type="email" id="customerEmail" name="customerEmail" placeholder="you@example.com">
          </div>
        </div>
        <div class="form-group">
          <label for="category">Product Category *</label>
          <select id="category" name="category" required>
            <option value="">-- Select --</option>
            <option value="fruits">Fruits</option>
            <option value="dairy">Dairy</option>
            <option value="handicrafts">Handicrafts</option>
            <option value="pickles">Homemade Pickles</option>
            <option value="organic">Organic Products</option>
          </select>
        </div>
        <div class="form-group">
          <label for="items">Items & Quantity *</label>
          <textarea id="items" name="items" required placeholder="e.g. 2 kg Mango, 1 litre Milk, 1 Bamboo Basket"></textarea>
        </div>
        <div class="form-group">
          <label for="address">Delivery Address *</label>
          <textarea id="address" name="address" required placeholder="Full address with landmark"></textarea>
        </div>
        <div class="form-group">
          <label for="notes">Special Notes (optional)</label>
          <input type="text" id="notes" name="notes" placeholder="Any preference or message">
        </div>
        <button type="submit" class="btn" style="width:100%;">Place Order</button>
        <p class="form-note">This is a front-end demo. No real order is placed.</p>
      </form>
    </div>
  </section>

  <footer>
    <p>© 2026 Village Market Hub | College Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
